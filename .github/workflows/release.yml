name: Release builds

# Builds the release files on GitHub's machines and keeps them as workflow
# artifacts. Releases themselves are published by hand (docs/RELEASING.md);
# the version comes from core/version.py.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # On Windows PyTorch is not part of the AI pack: the app downloads the
      # official CPU or CUDA wheel itself. The CPU build installed here only
      # sets the PyTorch version and pulls in its dependencies for the pack.
      - name: Install PyTorch (CPU build)
        if: runner.os == 'Windows'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*
          compression-level: 0
